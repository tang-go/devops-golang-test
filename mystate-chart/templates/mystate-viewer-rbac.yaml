apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mystate-chart.fullname" . }}-mystate-viewer-role
  labels:
  {{- include "mystate-chart.labels" . | nindent 4 }}
rules:
- apiGroups:
  - myapp.hzy.com
  resources:
  - mystates
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - myapp.hzy.com
  resources:
  - mystates/status
  verbs:
  - get