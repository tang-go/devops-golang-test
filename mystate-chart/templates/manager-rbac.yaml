apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mystate-chart.fullname" . }}-manager-role
  labels:
  {{- include "mystate-chart.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods/status
  verbs:
  - get
- apiGroups:
  - myapp.hzy.com
  resources:
  - mystates
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - myapp.hzy.com
  resources:
  - mystates/finalizers
  verbs:
  - update
- apiGroups:
  - myapp.hzy.com
  resources:
  - mystates/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mystate-chart.fullname" . }}-manager-rolebinding
  labels:
  {{- include "mystate-chart.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: '{{ include "mystate-chart.fullname" . }}-manager-role'
subjects:
- kind: ServiceAccount
  name: '{{ include "mystate-chart.fullname" . }}-controller-manager'
  namespace: '{{ .Release.Namespace }}'